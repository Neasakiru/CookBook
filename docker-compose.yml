services:
  backend:
    build:
      context: ./backend
    container_name: recipe-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
    container_name: recipe-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm start"
    depends_on:
      - backend

volumes:
  backend_modules:
  frontend_modules:
